services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project_assistant
      POSTGRES_USER: project_user
      POSTGRES_PASSWORD: project_password
    ports:
      - "5432:5432"
    volumes:
      - project_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_user -d project_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/ProjectAssistant.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=project_assistant;Username=project_user;Password=project_password
      Jwt__Key: ThisIsADevelopmentKeyThatShouldBeChangedBeforeDeployment12345
      Jwt__Issuer: ProjectAssistant
      Jwt__Audience: ProjectAssistantClient
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  project_data:
