services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: emergency_response
      POSTGRES_USER: emergency_user
      POSTGRES_PASSWORD: emergency_password
    ports:
      - "5434:5432"
    volumes:
      - emergency_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emergency_user -d emergency_response"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/EmergencyResponse.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=emergency_response;Username=emergency_user;Password=emergency_password
      Jwt__Key: ThisDevelopmentKeyShouldBeChangedBeforeDeployment123456
      Jwt__Issuer: EmergencyResponse
      Jwt__Audience: EmergencyResponseClient
    ports:
      - "8081:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5174:80"
    depends_on:
      - api

volumes:
  emergency_data:
