server:
  port: 8090

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/supportflow}
    username: ${SPRING_DATASOURCE_USERNAME:support_user}
    password: ${SPRING_DATASOURCE_PASSWORD:support_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:ThisDevelopmentSecretNeedsToBeChangedBeforeDeployment123456789}
    expiration-minutes: 480

springdoc:
  swagger-ui:
    path: /swagger-ui.html
