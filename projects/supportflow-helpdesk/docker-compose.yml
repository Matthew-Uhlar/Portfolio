services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supportflow
      POSTGRES_USER: support_user
      POSTGRES_PASSWORD: support_password
    ports:
      - "5435:5432"
    volumes:
      - supportflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_user -d supportflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/supportflow
      SPRING_DATASOURCE_USERNAME: support_user
      SPRING_DATASOURCE_PASSWORD: support_password
      JWT_SECRET: ThisDevelopmentSecretNeedsToBeChangedBeforeDeployment123456789
    ports:
      - "8090:8090"
    depends_on:
      database:
        condition: service_healthy

volumes:
  supportflow_data:
