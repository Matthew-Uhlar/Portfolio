name: Showcase checks

on:
  push:
    paths: ['showcase/**', '.github/workflows/showcase.yml']
  pull_request:
    paths: ['showcase/**', '.github/workflows/showcase.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-tracker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase/application-tracker
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: showcase/application-tracker
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm test

  support-ticket-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase/support-ticket-api
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: showcase/support-ticket-api
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -v

  dependency-lens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase/dependency-lens
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: showcase/dependency-lens
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node src/cli.js examples/healthy --strict
