name: Publish portfolio website

on:
  push:
    branches: [main]
    paths:
      - 'showcase/index.html'
      - 'showcase/portfolio.css'
      - '.github/workflows/portfolio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: showcase
      - uses: actions/configure-pages@v5
      - name: Prepare the static website
        run: |
          mkdir -p public-site
          cp showcase/index.html showcase/portfolio.css public-site/
          test -s public-site/index.html
          test -s public-site/portfolio.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
