name: Record project demos

# Records a demo video (MP4 + GIF preview) for every project and publishes them with the
# portfolio website. Docker apps are built with Compose and driven by Playwright; command
# line tools are captured from real terminal sessions. Run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: record-demos
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply one-time portfolio reorganization
        run: |
          if [ -d "Major Projects" ]; then
            python3 .github/demo/setup.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Reorganize portfolio, fix build issues and add demo sections"
            git push
          else
            echo "Already reorganized"
          fi

  record:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ai-project-management-assistant, compose: projects/ai-project-management-assistant }
          - { name: emergency-response-platform, compose: projects/emergency-response-platform }
          - { name: enterprise-inventory-system, compose: projects/enterprise-inventory-system }
          - { name: supportflow-helpdesk, compose: projects/supportflow-helpdesk }
          - { name: sentinelhash }
          - { name: childcare-inventory }
          - { name: signal-siege }
          - { name: application-tracker }
          - { name: support-ticket-api }
          - { name: dependency-lens }
          - { name: prestige-construction }
          - { name: csc500 }
          - { name: csc500-shopping-cart }
          - { name: signalready }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Start the application with Docker Compose
        if: matrix.compose
        working-directory: ${{ matrix.compose }}
        run: docker compose up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recording tools
        run: |
          pip install -q playwright==1.47.0 pexpect pygame-ce Flask==3.0.3 Werkzeug==3.0.3
          python -m playwright install --with-deps chromium >/dev/null
          sudo apt-get install -y -q ffmpeg fonts-dejavu-core jq >/dev/null
      - name: Fetch coursework and hackathon repositories
        if: startsWith(matrix.name, 'csc500') || matrix.name == 'signalready'
        run: |
          git clone -q --depth 1 https://github.com/Matthew-Uhlar/CSC500 /tmp/CSC500
          git clone -q --depth 1 https://github.com/Matthew-Uhlar/CSC500-Portfolio /tmp/CSC500-Portfolio
          git clone -q --depth 1 https://github.com/Matthew-Uhlar/SeptHackathon2026 /tmp/SeptHackathon2026
      - name: Record demo
        run: python .github/demo/record.py ${{ matrix.name }} out
      - name: Application logs
        if: always() && matrix.compose
        working-directory: ${{ matrix.compose }}
        run: docker compose logs --no-color --tail=120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-${{ matrix.name }}
          path: |
            out/
            /tmp/demo-fail-*.png
          if-no-files-found: warn

  publish:
    needs: record
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Commit recorded demos
        run: |
          mkdir -p demos
          find artifacts -name '*-demo.mp4' -exec cp {} demos/ \;
          find artifacts -name '*-demo.gif' -exec cp {} demos/ \;
          ls -la demos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos
          git diff --cached --quiet || (git commit -q -m "Add recorded demo videos" && git push)
      - uses: actions/configure-pages@v5
      - name: Build the website
        run: |
          mkdir -p public-site
          cp showcase/index.html showcase/portfolio.css public-site/
          cp -r demos public-site/demos
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
