name: CI

# Builds and tests every app in projects/ on each push and pull request.
on:
  push:
    branches: [main]
    paths: ['projects/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['projects/**', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Project Pilot
            tests: projects/ai-project-management-assistant/backend/ProjectAssistant.Api.Tests
          - name: Response Grid
            tests: projects/emergency-response-platform/backend/EmergencyResponse.Api.Tests
          - name: StockPilot
            tests: projects/enterprise-inventory-system/backend/Inventory.Api.Tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test "${{ matrix.tests }}" --logger "console;verbosity=normal"

  java:
    name: Java tests (SupportFlow)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/supportflow-helpdesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B test

  frontend:
    name: Frontend build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Project Pilot
            dir: projects/ai-project-management-assistant/frontend
          - name: Response Grid
            dir: projects/emergency-response-platform/frontend
          - name: StockPilot
            dir: projects/enterprise-inventory-system/frontend
          - name: SupportFlow
            dir: projects/supportflow-helpdesk/frontend
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Type check and build
        run: npm run build
